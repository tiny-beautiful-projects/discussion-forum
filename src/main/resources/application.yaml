spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 쿼리 줄바꿈 (포맷팅)

# 로깅 레벨 설정 (SQL 쿼리 + 매개변수 값 출력)
logging:
  level:
    org:
      hibernate:
        SQL: debug                  # 실행되는 SQL 쿼리 출력
        type:
          descriptor:
            sql: trace              # ?에 바인딩되는 실제 파라미터 값 출력